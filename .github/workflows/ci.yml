name: CI

on: [push, pull_request]

jobs:
  # Backend: lint, migrations, and tests — all against a real Postgres 16
  # service container so engine-specific behavior is caught before deploy.
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: test
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      JWT_SECRET: ci-test-secret-padded-past-32-bytes-minimum
      TEST_DATABASE_URL: postgresql+psycopg2://postgres:test@localhost:5432/postgres
      # The migration step targets the same database; the suite ignores this
      # and uses TEST_DATABASE_URL.
      DATABASE_URL: postgresql+psycopg2://postgres:test@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      # Exercise the actual migration chain against Postgres (the deploy
      # artifact), and fail if models have drifted from the migrations.
      # The test suite rebuilds its schema from the models, so this step is
      # the only place the migrations themselves are proven.
      - name: Run and verify migrations
        run: |
          alembic upgrade head
          alembic check
          # alembic check compares columns and indexes, not Postgres enum
          # values or CHECK constraints: a migration that forgot to add the
          # 'new' status or the priority range check would pass it. Look at
          # the migrated schema directly for both.
          python - <<'EOF'
          from sqlalchemy import CheckConstraint, create_engine, inspect, text
          from app import models
          from app.database import DATABASE_URL
          with create_engine(DATABASE_URL).connect() as conn:
              labels = conn.execute(text(
                  "SELECT e.enumlabel FROM pg_enum e JOIN pg_type t ON t.oid = e.enumtypid "
                  "WHERE t.typname = 'ticketstatus' ORDER BY e.enumsortorder"
              )).scalars().all()
              expected = [s.value for s in models.TicketStatus]
              assert labels == expected, f"enum values {labels} != {expected}"
              present = {c["name"] for c in inspect(conn).get_check_constraints("tickets")}
              wanted = {c.name for c in models.Ticket.__table__.constraints if isinstance(c, CheckConstraint)}
              assert wanted <= present, f"missing CHECK constraints: {wanted - present}"
          print("migrated schema ok: enum", labels, "checks", sorted(wanted))
          EOF
          # Every migration must undo cleanly and the chain must rebuild from
          # nothing; a leftover enum type once broke exactly this.
          alembic downgrade base
          alembic upgrade head
      - run: pytest --cov=app

  # Frontend: lockfile-exact install, lint, unit tests, and a production
  # build so bundling errors surface here rather than at deploy time.
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: client/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build

  # Image: build the Dockerfile and boot the app inside it. Without this, a
  # Dockerfile edit or a base-image bump could pass CI and still fail on the
  # host, because the test job runs on the runner's Python, not the image's.
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: docker build -t ticket-system-api:ci .
      # Run the image's real entrypoint, not just an import: migrations on
      # boot, the non-root user writing the SQLite fallback, uvicorn, and the
      # health route all have to work for /health to answer 200.
      - name: Boot the image and probe /health
        run: |
          docker run -d --name api -p 8000:8000 \
            -e JWT_SECRET=ci-image-secret-padded-past-32-bytes-minimum \
            ticket-system-api:ci
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:8000/health; then echo; exit 0; fi
            sleep 1
          done
          echo "::error::/health never answered"; docker logs api; exit 1
      - if: always()
        run: docker rm -f api

  deploy:
    # Deploys on merge to main once all three jobs pass. Uses a Render deploy hook:
    # create the hook in the Render dashboard and save it as the RENDER_DEPLOY_HOOK_URL secret.
    needs: [test, frontend, image]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    # One deploy at a time, in order, never cancelled: two merges in quick
    # succession each ship their own tested commit instead of racing.
    concurrency:
      group: deploy-main
      cancel-in-progress: false
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Render deploy
        env:
          DEPLOY_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          # This job is the only path to production, so a missing secret is a
          # broken pipeline, not a green no-op.
          if [ -z "$DEPLOY_HOOK" ]; then
            echo "::error::RENDER_DEPLOY_HOOK_URL secret is not set; nothing was deployed."
            exit 1
          fi
          # Name the commit that passed. Without `ref`, Render builds
          # whatever is at the head of the branch when the hook fires,
          # which can be a later push whose checks have not finished.
          case "$DEPLOY_HOOK" in *\?*) sep='&' ;; *) sep='?' ;; esac
          curl -fsS -X POST "${DEPLOY_HOOK}${sep}ref=${GITHUB_SHA}"
