name: CI

on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: test
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      JWT_SECRET: ci-test-secret-padded-past-32-bytes-minimum
      TEST_DATABASE_URL: postgresql+psycopg2://postgres:test@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: ruff check .
      # Exercise the actual migration chain against Postgres (the deploy
      # artifact), and fail if models have drifted from the migrations.
      - name: Run and verify migrations
        env:
          DATABASE_URL: postgresql+psycopg2://postgres:test@localhost:5432/postgres
        run: |
          alembic upgrade head
          alembic check
      - run: pytest --cov=app

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build

  deploy:
    # Deploys on merge to main once both jobs pass. Uses a Render deploy hook:
    # create the hook in the Render dashboard and save it as the RENDER_DEPLOY_HOOK_URL secret.
    needs: [test, frontend]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Render deploy
        env:
          DEPLOY_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          if [ -z "$DEPLOY_HOOK" ]; then
            echo "RENDER_DEPLOY_HOOK_URL secret not set; skipping deploy."
          else
            curl -fsS -X POST "$DEPLOY_HOOK"
          fi
